<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #FDFCFA; }
    a { color: #21212B; } a:hover { color: #40404a; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FDFCFA; font-family: 'Inter', system-ui, sans-serif; color: #21212B;">

  <svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0;">
    <defs>
      <radialGradient id="mBlue" cx="20%" cy="15%" r="55%">
        <stop offset="0%" stop-color="#7FA6E0" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#7FA6E0" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="mPurple" cx="80%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#8C7FE0" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#8C7FE0" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="mPink" cx="35%" cy="70%" r="55%">
        <stop offset="0%" stop-color="#E39BC9" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#E39BC9" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="mPurple2" cx="75%" cy="85%" r="50%">
        <stop offset="0%" stop-color="#8C7FE0" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#8C7FE0" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="390" height="844" fill="#FDFCFA"></rect>
    <rect width="390" height="844" fill="url(#mBlue)"></rect>
    <rect width="390" height="844" fill="url(#mPurple)"></rect>
    <rect width="390" height="844" fill="url(#mPink)"></rect>
    <rect width="390" height="844" fill="url(#mPurple2)"></rect>
  </svg>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 48px 28px 20px;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="32" height="32" viewBox="0 0 120 120" fill="none">
        <rect width="120" height="120" rx="32" fill="#21212B"></rect>
        <circle cx="54" cy="56" r="26" stroke="#FDFCFA" stroke-width="10"></circle>
        <path d="M70 70l12 12" stroke="#FDFCFA" stroke-width="10" stroke-linecap="round"></path>
        <path d="M92 60l-10 20h12l-10 20" stroke="#E2825B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.2px;">Quizkr</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 36px; line-height: 1.1; letter-spacing: -0.5px; text-wrap: pretty;">Your notes, turned into a quiz.</div>
      <div style="font-size: 15px; line-height: 1.4; font-weight: 400; color: #21212B; opacity: 0.65; text-wrap: pretty;">Scan a page, upload a PDF, or paste text. Quizkr writes the questions and checks your answers as you go.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 58px; border-radius: 999px; background: #FDFCFA; border: 1.5px solid rgba(33,33,43,0.08); display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4c-.2 1.2-.9 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z" fill="#4285F4"></path>
          <path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6C4.8 19.8 8.2 22 12 22z" fill="#34A853"></path>
          <path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1C2.4 8.8 2 10.4 2 12s.4 3.2 1.1 4.6L6.4 14z" fill="#FBBC05"></path>
          <path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8.2 2 4.8 4.2 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#EA4335"></path>
        </svg>
        <div style="font-family: 'Inter', system-ui, sans-serif; font-size: 15.5px; font-weight: 700; color: #21212B;">Continue with Google</div>
      </div>
      <div style="text-align: center; font-size: 12.5px; font-weight: 500; color: #21212B; opacity: 0.55; line-height: 1.5;">By continuing you agree to the Terms and Privacy Policy.</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
