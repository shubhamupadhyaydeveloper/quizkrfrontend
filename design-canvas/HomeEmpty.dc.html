<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F5F4F1; }
    a { color: #21212B; } a:hover { color: #40404a; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F4F1; font-family: 'Inter', system-ui, sans-serif; color: #21212B;">

  <div style="position: absolute; inset: 0; padding: 48px 20px 120px; display: flex; flex-direction: column; gap: 28px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden;">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="19" r="8" fill="#21212B"></circle>
            <path d="M8 46c2-10 8-15 16-15s14 5 16 15z" fill="#21212B"></path>
          </svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">Hello, Aarav</div>
          <div style="font-size: 14px; font-weight: 500; color: #6E6E78;">Let's make your first quiz.</div>
        </div>
      </div>
      <div style="height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 7px; font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 14px;">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #E2825B;"></div>
        <span>20</span>
        <span style="font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 12px; color: #6E6E78;">free credits</span>
      </div>
    </div>

    <div style="position: relative; border-radius: 24px; background: #FFFFFF;">
      <div style="position: absolute; inset: 0; border-radius: inherit; overflow: hidden;">
        <svg width="100%" height="100%" viewBox="0 0 350 232" preserveAspectRatio="none" style="position: absolute; inset: 0;">
          <defs>
            <radialGradient id="heroBlue" cx="20%" cy="15%" r="55%"><stop offset="0%" stop-color="#7FA6E0" stop-opacity="0.9"></stop><stop offset="100%" stop-color="#7FA6E0" stop-opacity="0"></stop></radialGradient>
            <radialGradient id="heroPurple" cx="80%" cy="30%" r="60%"><stop offset="0%" stop-color="#8C7FE0" stop-opacity="0.95"></stop><stop offset="100%" stop-color="#8C7FE0" stop-opacity="0"></stop></radialGradient>
            <radialGradient id="heroPink" cx="35%" cy="70%" r="55%"><stop offset="0%" stop-color="#E39BC9" stop-opacity="0.9"></stop><stop offset="100%" stop-color="#E39BC9" stop-opacity="0"></stop></radialGradient>
            <radialGradient id="heroPurple2" cx="75%" cy="85%" r="50%"><stop offset="0%" stop-color="#8C7FE0" stop-opacity="0.7"></stop><stop offset="100%" stop-color="#8C7FE0" stop-opacity="0"></stop></radialGradient>
          </defs>
          <g opacity="0.45">
            <rect width="350" height="232" fill="url(#heroBlue)"></rect>
            <rect width="350" height="232" fill="url(#heroPurple)"></rect>
            <rect width="350" height="232" fill="url(#heroPink)"></rect>
            <rect width="350" height="232" fill="url(#heroPurple2)"></rect>
          </g>
        </svg>
      </div>
      <svg style="position: absolute; right: 8px; top: -18px;" width="130" height="121" viewBox="0 0 150 140" fill="none">
        <rect x="32" y="40" width="72" height="90" rx="12" fill="#E2825B"></rect>
        <rect x="40" y="30" width="72" height="90" rx="12" fill="#FFFFFF" stroke="#21212B" stroke-width="2"></rect>
        <rect x="54" y="48" width="44" height="7" rx="3.5" fill="#21212B"></rect>
        <rect x="54" y="63" width="30" height="7" rx="3.5" fill="#21212B" opacity="0.3"></rect>
        <rect x="54" y="78" width="38" height="7" rx="3.5" fill="#21212B" opacity="0.3"></rect>
        <circle cx="98" cy="104" r="14" fill="#E2825B"></circle>
        <path d="M91.5 104l4.5 4.5 9-9.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M0 -10C0 -2 2 0 10 0C2 0 0 2 0 10C0 2 -2 0 -10 0C-2 0 0 -2 0 -10Z" fill="#E2825B" transform="translate(126 24) scale(1.1)"></path>
        <path d="M0 -10C0 -2 2 0 10 0C2 0 0 2 0 10C0 2 -2 0 -10 0C-2 0 0 -2 0 -10Z" fill="#E2825B" transform="translate(22 24) scale(0.55)"></path>
      </svg>
      <div style="position: relative; padding: 24px 22px 0; display: flex; flex-direction: column; gap: 8px; max-width: 200px;">
        <div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; line-height: 1.08; letter-spacing: -0.02em; text-wrap: pretty;">Make a new quiz</div>
        <div style="font-size: 14px; font-weight: 500; line-height: 1.45; color: #6E6E78;">From a photo, a PDF, or pasted notes. Your first 20 are free.</div>
      </div>
      <div style="position: relative; margin: 20px 22px 0; height: 1px; background: rgba(33,33,43,0.08);"></div>
      <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 16px; font-size: 15px; font-weight: 600; color: #21212B;">
        <span>Create a quiz</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid rgba(33,33,43,0.12); display: flex; align-items: center; justify-content: center; color: #21212B;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5l2-3h5l2 3H20v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; color: #21212B;">Scan</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid rgba(33,33,43,0.12); display: flex; align-items: center; justify-content: center; color: #21212B;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="2.5"></rect><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; color: #21212B;">PDF</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid rgba(33,33,43,0.12); display: flex; align-items: center; justify-content: center; color: #21212B;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4.5" width="12" height="16.5" rx="2"></rect><path d="M9.5 4.5V3h5v1.5"></path><path d="M9.5 11h5"></path><path d="M9.5 15h3"></path></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; color: #21212B;">Paste</div>
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 0 24px;">
      <svg width="120" height="110" viewBox="0 0 120 110" fill="none">
        <rect x="24" y="24" width="60" height="78" rx="10" fill="#21212B"></rect>
        <rect x="30" y="16" width="60" height="78" rx="10" fill="#FFFFFF" stroke="#21212B" stroke-width="2"></rect>
        <rect x="42" y="32" width="36" height="6" rx="3" fill="#21212B"></rect>
        <rect x="42" y="45" width="24" height="6" rx="3" fill="#21212B" opacity="0.3"></rect>
        <rect x="42" y="58" width="30" height="6" rx="3" fill="#21212B" opacity="0.3"></rect>
        <path d="M0 -10C0 -2 2 0 10 0C2 0 0 2 0 10C0 2 -2 0 -10 0C-2 0 0 -2 0 -10Z" fill="#E2825B" transform="translate(100 20) scale(1.2)"></path>
        <path d="M0 -10C0 -2 2 0 10 0C2 0 0 2 0 10C0 2 -2 0 -10 0C-2 0 0 -2 0 -10Z" fill="#E2825B" transform="translate(110 46) scale(0.6)"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em;">No quizzes yet</div>
        <div style="font-size: 14px; font-weight: 500; line-height: 1.5; color: #6E6E78; text-wrap: pretty;">Your quizzes and results will show up here once you make one.</div>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 70px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(33,33,43,0.08); display: flex; align-items: center; justify-content: space-around; padding: 0 14px;">
    <div style="width: 50px; height: 50px; border-radius: 50%; background: #21212B; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"></path><path d="M6 10v9h12v-9"></path></svg>
    </div>
    <div style="width: 50px; height: 50px; border-radius: 50%; color: #6E6E78; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>
    </div>
    <div style="width: 50px; height: 50px; border-radius: 50%; color: #6E6E78; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4V4z"></path></svg>
    </div>
    <div style="width: 50px; height: 50px; border-radius: 50%; color: #6E6E78; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-6 7-6s6 2 7 6"></path></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
